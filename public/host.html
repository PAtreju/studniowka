<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2a0a14" />
  <title>Teleturniej – ekran</title>
  <link rel="stylesheet" href="/fonts.css" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/host.css" />
</head>
<body>
  <div id="auth" class="auth hidden">
    <form id="authForm" class="card">
      <h2>Ekran prowadzącego</h2>
      <p class="muted">Wpisz klucz prowadzącego (widać go w konsoli po uruchomieniu serwera).</p>
      <input id="authKey" autocomplete="off" placeholder="Klucz" />
      <button class="btn primary">Wejdź</button>
      <p id="authErr" class="err"></p>
    </form>
  </div>

  <header class="top">
    <div class="brand"><span id="topTitle">Teleturniej Studniówkowy</span></div>
    <div class="top-right">
      <span id="joinSmall" class="join-small"></span>
      <span class="pill">Na sali: <b id="playerCount">0</b></span>
    </div>
  </header>

  <main id="stage" class="stage"></main>

  <footer class="controls">
    <button id="btnMenu" class="btn danger">Wróć do menu</button>
    <div class="spacer"></div>
    <span id="hint" class="muted hint">Spacja lub strzałka w prawo: dalej</span>
    <button id="btnFs" class="btn" title="Pełny ekran (klawisz F)">Pełny ekran</button>
    <button id="btnNext" class="btn primary">Dalej</button>
  </footer>

  <div id="conn" class="conn hidden">Brak połączenia z serwerem…</div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script src="/host.js"></script>
</body>
</html>
